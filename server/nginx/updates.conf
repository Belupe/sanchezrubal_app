# =====================================================================
# nginx del servicio `updates`: sirve los instaladores + version.json de
# cada plataforma (android/, windows/) y la página de descarga.
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # version.json de cualquier plataforma: NO cachear (detectar al momento).
    location ~* /version\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
    }

    # APK de Android: MIME correcto + forzar descarga.
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
    }

    # Instalador de Windows: forzar descarga.
    location ~* \.exe$ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
}

# =====================================================================
# nginx del servicio `updates`: sirve los instaladores + version.json de
# cada plataforma (windows/, linux/) y la página de descarga.
#
# OJO con add_header: dentro de un `location` REEMPLAZA el conjunto heredado
# del bloque `server`, no lo amplía. Por eso cada location que añade cabeceras
# tiene que repetir también X-Content-Type-Options.
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # version.json de cualquier plataforma: NO cachear (detectar al momento).
    location ~* /version\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
    }

    # APK de Android: MIME correcto + forzar descarga.
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Instalador de Windows: forzar descarga.
    location ~* \.exe$ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Paquetes de Linux: forzar descarga. La regex ~* no distingue mayúsculas,
    # así que \.appimage$ cubre también el .AppImage real.
    location ~* \.(appimage|deb|tar\.gz)$ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
}

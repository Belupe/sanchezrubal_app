name: portal_familia
description: "Portal Familia — gestión de casas familiares (web + móvil)."
publish_to: "none"
# Versión visible: VERSIÓN.BUILD.TEST. El último dígito llega hasta 9 y al
# siguiente se resetea subiendo el del medio (1.2.9 -> 1.3.0).
# El número tras el '+' es OTRA cosa: el contador interno de Apple
# (CFBundleVersion). Solo puede subir y nunca repetirse, así que no sigue el
# esquema de arriba — si retrocediera, App Store Connect rechazaría la subida.
version: 1.2.5+5

environment:
  # [2I-08] Alineado con lo que exige el pubspec.lock (Dart >=3.12).
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  table_calendar: ^3.1.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  http: ^1.2.2
  package_info_plus: ^10.1.0
  dio: ^5.9.2
  # [2L-04] open_filex/permission_handler se usaban SOLO para instalar el APK de
  # auto-update en Android; ahora Android va por Google Play → eliminadas.
  path_provider: ^2.1.6
  app_links: ^7.1.2
  crypto: ^3.0.6
  flutter_secure_storage: ^10.3.1  # 10.x compatible con package_info_plus 10.x (win32)
  shared_preferences: ^2.5.5       # ya transitivo; explícito para el linter y la migración [M-09]
  # Abrir la carpeta de registros (file://) y la página de descargas cuando la
  # app no puede auto-actualizarse (.deb / .tar.gz). Ya era transitivo.
  url_launcher: ^6.3.1
  # Compartir el informe del último fallo desde el móvil (mailto: no admite
  # adjuntos, así que hace falta el menú de compartir del sistema).
  # (la 13.x es la que casa con package_info_plus 10.x por la versión de win32;
  # las 10.x-12.x piden win32 ^5 y rompen la resolución)
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Iconos multiplataforma. Cambia las imágenes en app_icons/ y ejecuta:
#   dart run flutter_launcher_icons
# Ver app_icons/README.md. iPadOS usa el mismo icono que iOS.
flutter_launcher_icons:
  image_path: "app_icons/icon_ios.png"
  ios: true
  image_path_ios: "app_icons/icon_ios.png"
  remove_alpha_ios: true
  android: true
  image_path_android: "app_icons/icon_android.png"
  macos:
    generate: true
    image_path: "app_icons/icon_macos.png"
  windows:
    generate: true
    image_path: "app_icons/icon_windows.png"
    icon_size: 256

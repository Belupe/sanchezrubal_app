name: portal_familia
description: "Portal Familia — gestión de casas familiares (web + móvil)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  table_calendar: ^3.1.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  http: ^1.2.2
  package_info_plus: ^10.1.0
  dio: ^5.9.2
  open_filex: ^4.7.0
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  app_links: ^7.1.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Iconos multiplataforma. Cambia las imágenes en app_icons/ y ejecuta:
#   dart run flutter_launcher_icons
# Ver app_icons/README.md. iPadOS usa el mismo icono que iOS.
flutter_launcher_icons:
  image_path: "app_icons/icon_ios.png"
  ios: true
  image_path_ios: "app_icons/icon_ios.png"
  remove_alpha_ios: true
  android: true
  image_path_android: "app_icons/icon_android.png"
  macos:
    generate: true
    image_path: "app_icons/icon_macos.png"
  windows:
    generate: true
    image_path: "app_icons/icon_windows.png"
    icon_size: 256
